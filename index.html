<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montaje 3D · Busca tu mueble</title>
<meta name="description" content="Busca tu mueble y míralo montarse en 3D, paso a paso, en español, neerlandés, francés o inglés.">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="catalog.css">
<link rel="modulepreload" href="js/catalog.js">
</head>
<body>
<header>
  <a class="brand" id="brand" href="./">Montaje <span>3D</span></a>
  <div class="langs" role="group" aria-label="Idioma" id="langs">
    <button type="button" data-lang="es" lang="es">ES</button>
    <button type="button" data-lang="nl" lang="nl">NL</button>
    <button type="button" data-lang="fr" lang="fr">FR</button>
    <button type="button" data-lang="en" lang="en">EN</button>
  </div>
</header>
<main class="catalog">
  <section class="hero">
    <h1 id="h1">¿Qué mueble vas a montar?</h1>
    <p class="lead" id="lead"></p>
    <form class="search" id="searchForm" role="search">
      <label for="q" class="sr" id="qLabel">Busca por nombre, tipo de mueble o medida</label>
      <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="80">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="cats" id="cats" role="group" aria-label="Tipo de mueble"></div>
  </section>
  <section class="results" aria-labelledby="h1">
    <p class="count" id="count" role="status"></p>
    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
      <button type="button" class="btn" id="showAll">Ver todos los muebles</button>
    </div>
    <p class="soon" id="soon"></p>
  </section>
</main>
<footer class="foot">
  <p id="foot"></p>
  <nav class="legal-links" id="legalNav" aria-label="Información legal">
    <a href="legal.html#legal" data-legal="legal" data-i="lnLegal">Aviso legal</a>
    <a href="legal.html#privacy" data-legal="privacy" data-i="lnPrivacy">Privacidad</a>
    <a href="legal.html#cookies" data-legal="cookies" data-i="lnCookies">Cookies</a>
    <a href="legal.html#terms" data-legal="terms" data-i="lnTerms">Condiciones de uso</a>
  </nav>
</footer>
<script type="module" src="js/catalog.js"></script>
</body>
</html>
